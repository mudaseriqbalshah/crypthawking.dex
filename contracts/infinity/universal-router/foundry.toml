# Mirrors upstream infinity-universal-router settings (solc 0.8.26, via-ir,
# 20000 runs, cancun, bytecode_hash none). lib/* are symlinks into ../core and
# ../periphery so all infinity packages share one vendored copy of each dep.
[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.26'
optimizer_runs = 20_000
via_ir = true
evm_version = 'cancun'
bytecode_hash = 'none'
auto_detect_remappings = false
remappings = [
    'forge-std/=lib/forge-std/src/',
    'ds-test/=lib/forge-std/lib/ds-test/src/',
    '@openzeppelin/=lib/infinity-core/lib/openzeppelin-contracts/',
    'openzeppelin-contracts/=lib/infinity-core/lib/openzeppelin-contracts/',
    'solmate/=lib/infinity-core/lib/solmate/',
    'infinity-periphery/=lib/infinity-periphery/',
    'infinity-core/=lib/infinity-core/',
    'permit2/=lib/permit2/',
]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"

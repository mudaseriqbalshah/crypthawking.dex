# Mirrors upstream infinity-core settings (solc 0.8.26, via-ir, 25666 runs —
# the pool managers are size-tuned; do not change).
[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
solc_version = '0.8.26'
optimizer_runs = 25_666
via_ir = true
evm_version = 'cancun'
bytecode_hash = 'none'
remappings = [
    'forge-std/=lib/forge-std/src/',
    '@openzeppelin/=lib/openzeppelin-contracts/',
    'solmate/=lib/solmate/',
]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"

[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
remappings = [
    "@openzeppelin/=lib/openzeppelin-contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [
    { access = "read-write", path = "../../packages/deployments/base-sepolia.json" },
]

[rpc_endpoints]
base_sepolia = "${RPC_URL}"
